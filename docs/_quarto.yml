project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - examples/*.qmd
  resources:
    - tools/*.html

website:
  title: "slimnine examples"
  sidebar:
    style: docked
    contents:
      - text: Home
        href: index.qmd
      - section: Examples
        contents:
          - examples/*.qmd
      - section: Tools
        contents:
          - text: Split DOE wafer estimator
            href: tools/split_doe_power.html

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    code-tools: true

execute:
  freeze: auto
